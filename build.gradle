plugins {
    id 'com.github.spotbugs-base'
    id 'com.github.johnrengelman.shadow'
    id 'de.undercouch.download'
    id 'net.researchgate.release'
}

description = 'Ballerina - CDC Schema Azure Blob Storage Driver'

ext.ballerinaLangVersion = project.ballerinaLangVersion

allprojects {
    group = project.group
    version = project.version

    apply plugin: 'maven-publish'

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }

    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
    }
}

def moduleVersion = project.version.replace("-SNAPSHOT", "")

subprojects {
    configurations {
        externalJars
    }

    dependencies {
        // Debezium Azure Blob storage backend
        externalJars(group: 'io.debezium', name: 'debezium-storage-azure-blob', version: "${debeziumVersion}") {
            transitive = false
        }

        // Azure SDK
        externalJars(group: 'com.azure', name: 'azure-storage-blob', version: "${azureStorageBlobVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-storage-common', version: "${azureStorageCommonVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-storage-internal-avro', version: "${azureStorageInternalAvroVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-core', version: "${azureCoreVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-core-http-netty', version: "${azureCoreHttpNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-identity', version: "${azureIdentityVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-json', version: "${azureJsonVersion}") {
            transitive = false
        }
        externalJars(group: 'com.azure', name: 'azure-xml', version: "${azureXmlVersion}") {
            transitive = false
        }

        // Azure Identity runtime closure. These must be listed because platform dependencies are non-transitive.
        externalJars(group: 'com.microsoft.azure', name: 'msal4j', version: "${msal4jVersion}") {
            transitive = false
        }
        externalJars(group: 'com.microsoft.azure', name: 'msal4j-persistence-extension', version: "${msal4jPersistenceExtensionVersion}") {
            transitive = false
        }
        externalJars(group: 'com.nimbusds', name: 'oauth2-oidc-sdk', version: "${oauth2OidcSdkVersion}") {
            transitive = false
        }
        externalJars(group: 'com.github.stephenc.jcip', name: 'jcip-annotations', version: "${jcipAnnotationsVersion}") {
            transitive = false
        }
        externalJars(group: 'com.nimbusds', name: 'content-type', version: "${contentTypeVersion}") {
            transitive = false
        }
        externalJars(group: 'com.nimbusds', name: 'lang-tag', version: "${langTagVersion}") {
            transitive = false
        }
        externalJars(group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: "${nimbusJoseJwtVersion}") {
            transitive = false
        }
        externalJars(group: 'net.minidev', name: 'json-smart', version: "${jsonSmartVersion}") {
            transitive = false
        }
        externalJars(group: 'net.minidev', name: 'accessors-smart', version: "${accessorsSmartVersion}") {
            transitive = false
        }
        externalJars(group: 'org.ow2.asm', name: 'asm', version: "${asmVersion}") {
            transitive = false
        }
        externalJars(group: 'net.java.dev.jna', name: 'jna', version: "${jnaVersion}") {
            transitive = false
        }
        externalJars(group: 'net.java.dev.jna', name: 'jna-platform', version: "${jnaVersion}") {
            transitive = false
        }

        // Jackson XML (required by Azure SDK for XML parsing)
        // Version aligned to 2.16.2 to match the CDC module's Jackson version (jackson-core/databind/annotations @ 2.16.2)
        externalJars(group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-xml', version: "${jacksonDataformatXmlVersion}") {
            transitive = false
        }
        // jackson-datatype-jsr310 is required by azure-core for Java 8 date/time serialization; not in BRE classpath
        externalJars(group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: "${jacksonDatatypeJsr310Version}") {
            transitive = false
        }

        // Reactor (required by azure-core and reactor-netty)
        // reactive-streams is reactor-core's only non-JDK dependency; not in BRE runtime
        externalJars(group: 'org.reactivestreams', name: 'reactive-streams', version: "${reactiveStreamsVersion}") {
            transitive = false
        }
        externalJars(group: 'io.projectreactor', name: 'reactor-core', version: "${reactorCoreVersion}") {
            transitive = false
        }
        externalJars(group: 'io.projectreactor.netty', name: 'reactor-netty-core', version: "${reactorNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.projectreactor.netty', name: 'reactor-netty-http', version: "${reactorNettyVersion}") {
            transitive = false
        }

        // Netty upper-layer JARs — not in BRE (BRE only has buffer/common/transport/resolver at 4.1.118)
        // Azure SDK is wired to use these specific versions via azure-core-http-netty
        externalJars(group: 'io.netty', name: 'netty-codec', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-codec-http', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-codec-http2', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-codec-socks', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-handler', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-handler-proxy', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-buffer', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-common', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-transport', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-resolver', version: "${azureNettyVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-transport-native-unix-common', version: "${azureNettyVersion}") {
            transitive = false
        }
        // DNS modules use a slightly different version (4.1.86.Final)
        externalJars(group: 'io.netty', name: 'netty-codec-dns', version: "${azureNettyDnsVersion}") {
            transitive = false
        }
        externalJars(group: 'io.netty', name: 'netty-resolver-dns', version: "${azureNettyDnsVersion}") {
            transitive = false
        }
    }
}

tasks.register('build') {
    dependsOn(':cdc.schema.azure.blob.driver-native:build')
    dependsOn(':cdc.schema.azure.blob.driver-ballerina:build')
}

release {
    buildTasks = ['build']
    failOnSnapshotDependencies = true
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v${version}'
    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}

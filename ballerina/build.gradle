import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - CDC Schema Azure Blob Storage Driver'

def packageName = "cdc.schema.azure.blob.driver"
def packageOrg = "ballerinax"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = ballerinaLangVersion
    isConnector = true
}

tasks.register('updateTomlFiles') {
    doLast {
        def newBallerinaToml = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newBallerinaToml = newBallerinaToml.replace("@toml.version@", tomlVersion)
        newBallerinaToml = newBallerinaToml.replace("@debezium.version@", debeziumVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.storage.blob.version@", azureStorageBlobVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.storage.common.version@", azureStorageCommonVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.storage.internal.avro.version@", azureStorageInternalAvroVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.core.version@", azureCoreVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.core.http.netty.version@", azureCoreHttpNettyVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.identity.version@", azureIdentityVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.json.version@", azureJsonVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.xml.version@", azureXmlVersion)
        newBallerinaToml = newBallerinaToml.replace("@msal4j.version@", msal4jVersion)
        newBallerinaToml = newBallerinaToml.replace("@msal4j.persistence.extension.version@", msal4jPersistenceExtensionVersion)
        newBallerinaToml = newBallerinaToml.replace("@oauth2.oidc.sdk.version@", oauth2OidcSdkVersion)
        newBallerinaToml = newBallerinaToml.replace("@jcip.annotations.version@", jcipAnnotationsVersion)
        newBallerinaToml = newBallerinaToml.replace("@content.type.version@", contentTypeVersion)
        newBallerinaToml = newBallerinaToml.replace("@lang.tag.version@", langTagVersion)
        newBallerinaToml = newBallerinaToml.replace("@nimbus.jose.jwt.version@", nimbusJoseJwtVersion)
        newBallerinaToml = newBallerinaToml.replace("@json.smart.version@", jsonSmartVersion)
        newBallerinaToml = newBallerinaToml.replace("@accessors.smart.version@", accessorsSmartVersion)
        newBallerinaToml = newBallerinaToml.replace("@asm.version@", asmVersion)
        newBallerinaToml = newBallerinaToml.replace("@jna.version@", jnaVersion)
        newBallerinaToml = newBallerinaToml.replace("@jackson.dataformat.xml.version@", jacksonDataformatXmlVersion)
        newBallerinaToml = newBallerinaToml.replace("@jackson.datatype.jsr310.version@", jacksonDatatypeJsr310Version)
        newBallerinaToml = newBallerinaToml.replace("@reactive.streams.version@", reactiveStreamsVersion)
        newBallerinaToml = newBallerinaToml.replace("@reactor.core.version@", reactorCoreVersion)
        newBallerinaToml = newBallerinaToml.replace("@reactor.netty.version@", reactorNettyVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.netty.version@", azureNettyVersion)
        newBallerinaToml = newBallerinaToml.replace("@azure.netty.dns.version@", azureNettyDnsVersion)
        ballerinaTomlFile.text = newBallerinaToml
    }
}

tasks.register('commitTomlFiles') {
    doLast {
        project.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml"
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv('publishUser')
                password = System.getenv('publishPAT')
            }
        }
    }
}

updateTomlFiles.dependsOn copyToLib

build.dependsOn "generatePomFileForMavenPublication"
build.dependsOn ":cdc.schema.azure.blob.driver-native:build"
test.dependsOn ":cdc.schema.azure.blob.driver-native:build"

publishToMavenLocal.dependsOn build
publish.dependsOn build
